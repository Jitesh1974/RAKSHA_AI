services:
  api:
    build: .
    env_file: .env.dev
    ports: ["8000:8000"]
    depends_on: [postgres]
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini:ro
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raksha
      POSTGRES_PASSWORD: raksha_dev_only
      POSTGRES_DB: raksha
    ports: ["5432:5432"]
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raksha -d raksha"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dev_postgres_data:
